[workspace]
resolver = "3"
members = ["crates/usx-core", "crates/usx-weather", "crates/us-explorer"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/goglesquirmintontheiii/us-explorer"

[profile.dev]
opt-level = 1
# Keep debug builds small: line tables for backtraces, no full debug info.
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
