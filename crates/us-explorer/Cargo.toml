[package]
name = "us-explorer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
usx-core = { path = "../usx-core" }
usx-weather = { path = "../usx-weather" }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts", "open_url", "manage_clipboard"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11.3"
texpresso = "2.0.2"
dejavu = "2.37.0"
ab_glyph = "0.2.32"
earcutr = "0.5.0"

[dependencies.bevy]
version = "=0.19.1"
default-features = false
features = [
  "default_app", "std", "bevy_winit", "multi_threaded", "x11", "wayland", "bevy_gilrs",
  "sysinfo_plugin", "default_font",
  "3d_api", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_post_process", "bevy_anti_alias",
  "png",
]
