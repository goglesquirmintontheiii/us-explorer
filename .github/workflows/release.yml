name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create from main (must match the crate version, e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the crate version
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$V" = "$TAG" ] || { echo "tag $TAG != version $V"; exit 1; }
      - name: Test
        run: cargo test --workspace --release
      - name: Build (fully optimised)
        run: cargo build --workspace --profile dist
      - name: AppImage
        run: packaging/build-appimage.sh target/dist "${TAG#v}" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=release-notes/${TAG}.md
          [ -f "$NOTES" ] || echo "US Explorer ${TAG}" > "$NOTES"
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "US Explorer ${TAG#v}" --notes-file "$NOTES"
